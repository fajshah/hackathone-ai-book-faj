openapi: 3.0.0
info:
  title: Better Auth API
  version: 1.0.0
  description: API specification for Better Auth integration with user profile management

paths:
  /api/auth/signup:
    post:
      summary: Register a new user with profile information
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: User's password
                software_experience:
                  type: string
                  enum: [beginner, intermediate, advanced]
                  description: User's software experience level
                hardware_knowledge:
                  type: string
                  enum: [none, basic, electronics, robotics, advanced]
                  description: User's hardware knowledge level
                interests:
                  type: array
                  items:
                    type: string
                    enum: [AI, Web, Mobile, Embedded, Data, Robotics]
                  description: User's interest areas
      responses:
        '200':
          description: User successfully registered
          content:
            application/json:
              schema:
              type: object
              properties:
                success:
                  type: boolean
                user:
                  $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/signin:
    post:
      summary: Authenticate user with credentials
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: User successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      summary: Get current user profile
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/signout:
    post:
      summary: Sign out current user
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successfully signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/profile:
    put:
      summary: Update user profile information
      tags:
        - Profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                software_experience:
                  type: string
                  enum: [beginner, intermediate, advanced]
                hardware_knowledge:
                  type: string
                  enum: [none, basic, electronics, robotics, advanced]
                interests:
                  type: array
                  items:
                    type: string
                    enum: [AI, Web, Mobile, Embedded, Data, Robotics]
      responses:
        '200':
          description: Profile successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  profile:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        software_experience:
          type: string
          enum: [beginner, intermediate, advanced]
        hardware_knowledge:
          type: string
          enum: [none, basic, electronics, robotics, advanced]
        interests:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time

    UserProfile:
      type: object
      properties:
        software_experience:
          type: string
          enum: [beginner, intermediate, advanced]
        hardware_knowledge:
          type: string
          enum: [none, basic, electronics, robotics, advanced]
        interests:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string